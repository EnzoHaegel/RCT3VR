; RCT3 VR mod settings. Key codes are Windows virtual-key codes (0x79 = F10).

[Display]
; Run in a borderless window instead of exclusive fullscreen (keeps rendering when unfocused)
ForceWindowed=1

[VR]
; OpenXR runtime manifest (.json) to load; empty = auto-detect the 32-bit build of the active runtime
RuntimeJson=
; Eye resolution as a multiple of the headset's recommended size
RenderScale=1.0
; 1 = VR switches on by itself in the ride camera (coaster view) and off when you leave it
AutoEnable=1
; F9 turns the mod on/off (with AutoEnable=0: VR on/off), F8 recenters the view on where you are looking
ToggleKey=0x78
RecenterKey=0x77
; Field of view (degrees) the game uses to decide what to draw in the ride camera.
; Wider = no objects missing when you turn your head, but lower detail far away. 0 = game default (90)
GameFov=140
; Game units per meter of head movement (bigger = you feel smaller)
WorldScale=1.0
; Anti-aliasing of the eye images: 0, 2, 4 or 8
MSAA=4
; Without a headset, show the side-by-side eye images on the monitor instead (for testing)
PreviewWithoutHeadset=0

[Controller]
; What each controller button does while in VR: a game key combo (game default keys:
; N = next camera, M = previous camera, B = camera type, Shift+N = next ride,
; Ctrl+C = leave the ride camera), "Recenter", or empty for nothing.
; A/B = right controller lower/upper button, X/Y = left controller lower/upper button.
ButtonA=N
ButtonB=Ctrl+C
ButtonX=
ButtonY=
RightStick=Recenter
LeftStick=

[Debug]
; Developer tools, off (0) by default.
; 0x79 = F10: writes one frame of D3D9 calls, shaders and render targets to rct3vr_capture_N\
CaptureKey=0
; 0x7A = F11: logs where the game stores its camera projection (field of view research)
ProbeKey=0
; Capture this frame number automatically (0 = off)
AutoCaptureFrame=0
; Capture automatically this many seconds after the first frame (0 = off)
AutoCaptureSeconds=0
; Terminate the game right after the automatic capture
ExitAfterAutoCapture=0
; Max number of render target snapshots saved per capture
MaxSnapshots=40
